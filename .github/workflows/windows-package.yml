name: Windows Package

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      architectures:
        type: string
        default: amd64
      release_build:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      tag:
        type: string
        default: ''
      prerelease:
        type: boolean
        default: false
      installation_tests:
        type: boolean
        default: false
    outputs:
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
      commit:
        value: ${{ jobs.build.outputs.commit }}
      version:
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Windows target architectures: amd64 or amd64,arm64'
        type: string
        default: amd64
      release_build:
        description: 'Prepare release-channel bytes without publishing'
        type: boolean
        default: false
      ref:
        description: 'Git ref to build; use main for a candidate or an existing vX.Y.Z tag for publication'
        required: true
        default: main
        type: string
      publish:
        description: 'Publish the verified package to the existing version tag'
        required: true
        default: false
        type: boolean
      tag:
        description: 'Existing vX.Y.Z tag; required only when publish is enabled'
        required: false
        default: ''
        type: string
      installation_tests:
        description: 'Run actual isolated installer/upgrade/recovery tests; mandatory for publication'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Publish as a prerelease; disabled by default'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-source:
    if: github.repository == 'eerraa/AgentDock-Workbench'
    name: Resolve requested ref once
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  linux-contracts:
    needs: resolve-source
    if: github.repository == 'eerraa/AgentDock-Workbench'
    name: Linux transaction and concurrency regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux backend and WSL helper contracts
        run: go test -p 2 ./... -count=1 -timeout=8m
      - name: Race detection on critical concurrency contracts
        run: go test -race -p 2 ./internal/activity ./internal/permission ./internal/insertion ./internal/fs/... ./internal/snapshot ./internal/acp ./internal/selfupdate ./internal/plugin ./internal/wslfilehelper -count=1 -timeout=8m
      - name: Record tested source identity
        id: identity
        env:
          EXPECTED_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$EXPECTED_COMMIT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf '{"commit":"%s","platform":"linux","backend":"passed","race":"passed","installation":"not_run"}\n' "$commit" > linux-verification.json
      - uses: actions/upload-artifact@v7
        with:
          name: linux-validation-${{ github.run_id }}
          path: linux-verification.json
          retention-days: 30
          if-no-files-found: error

  native-acceptance:
    needs: resolve-source
    uses: ./.github/workflows/workbench-acceptance.yml
    with:
      ref: ${{ needs.resolve-source.outputs.commit }}
      architectures: ${{ inputs.architectures || 'amd64' }}

  build:
    needs: [resolve-source, linux-contracts, native-acceptance]
    if: github.repository == 'eerraa/AgentDock-Workbench'
    name: Build verified unsigned Windows packages
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      BUILD_ARCHITECTURES: ${{ inputs.architectures || 'amd64' }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      channel: ${{ steps.metadata.outputs.channel }}
      publish: ${{ steps.metadata.outputs.publish }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve immutable build metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
          MANUAL_TAG: ${{ inputs.tag }}
          INSTALLATION_TESTS: ${{ inputs.installation_tests }}
          EXPECTED_COMMIT: ${{ needs.resolve-source.outputs.commit }}
          TESTED_COMMIT: ${{ needs.linux-contracts.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& go run ./tools/release version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Could not resolve a semantic AgentDock version.'
          }
          $commit = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve the source commit.'
          }
          if ($commit -ne $env:EXPECTED_COMMIT -or $commit -ne $env:TESTED_COMMIT) {
            throw 'Source, Linux validation and Windows build commits differ.'
          }
          $changes = @(& git status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $changes.Count -ne 0) {
            throw 'GitHub release builds require a clean checkout.'
          }

          if ($env:BUILD_ARCHITECTURES -notin @('amd64','amd64,arm64')) { throw 'Unsupported Windows architecture scope.' }
          $publish = $false
          $prerelease = $false
          $tag = ''
          if ('${{ inputs.release_build }}' -eq 'true') {
            # A reusable all-platform build never publishes Windows early.
            $publish = $false
          } elseif ($env:EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF -notlike 'refs/tags/v*') {
              throw 'Automatic publication is only supported for v* tags.'
            }
            $publish = $true
            $tag = $env:EVENT_TAG.Trim()
          } else {
            $publish = $env:MANUAL_PUBLISH -eq 'true'
            $prerelease = $env:MANUAL_PRERELEASE -eq 'true'
            $tag = ([string]$env:MANUAL_TAG).Trim()
            if ($publish -and [string]::IsNullOrWhiteSpace($tag)) {
              throw 'Manual publication requires the tag input.'
            }
          }

          if ($publish -and ($env:EVENT_NAME -ne 'workflow_dispatch' -or $env:INSTALLATION_TESTS -ne 'true' -or $prerelease -or $env:BUILD_ARCHITECTURES -ne 'amd64')) {
            throw 'Formal fork publication requires explicit x64 isolated installation acceptance and prerelease=false.'
          }
          if ($publish -and ([version]$version -le [version]'1.1.8' -or @('1.1.6100','1.1.16101','1.1.16102','1.1.17100') -contains $version)) { throw 'The distribution version must follow the upstream baseline and never reuse a published fork version.' }
          if (-not [string]::IsNullOrWhiteSpace($tag)) {
            & go run ./tools/release verify-version $tag
            if ($LASTEXITCODE -ne 0) {
              throw "Tag $tag does not match AgentDock $version."
            }
            $tagCommit = (& git rev-list -n 1 $tag 2>$null).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $commit) {
              throw "Tag $tag must already exist and point to $commit."
            }
          }

          $channel = if ($publish -or '${{ inputs.release_build }}' -eq 'true') { 'release' } else { 'candidate-not-released' }
          $artifactName = "agentdock-windows-$version-$env:GITHUB_RUN_ID"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding ascii -Append
          "commit=$commit" | Out-File $env:GITHUB_OUTPUT -Encoding ascii -Append
          "channel=$channel" | Out-File $env:GITHUB_OUTPUT -Encoding ascii -Append
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding ascii -Append
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Encoding ascii -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding ascii -Append
          "artifact_name=$artifactName" | Out-File $env:GITHUB_OUTPUT -Encoding ascii -Append

      # The required native-acceptance job already runs this exact source's
      # WPF suite and retains its screenshots. Do not render it a second time.

      - name: Backend regression
        run: |
          $ErrorActionPreference = 'Stop'
          # Isolate packages that build real binaries from Windows process/journal
          # fixtures. In-test concurrency, deadlines and assertions are unchanged.
          New-Item -ItemType Directory -Path dist/windows-package -Force | Out-Null
          go test -p 1 ./... -count=1 -timeout=8m -json > dist/windows-package/backend-validation.jsonl
          if ($LASTEXITCODE -ne 0) { Get-Content dist/windows-package/backend-validation.jsonl -Tail 100; throw 'Go tests failed.' }

      - name: Static analysis
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed.' }

      - name: Desktop pure-policy regression
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project desktop/windows/control-panel-tests/AgentDock.ControlPanel.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Desktop pure-policy tests failed.' }

      - name: Require complete Korean product validation before publication
        id: korean
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('TestMCPAppKoreanDictionaryAndRendererContract','TestAuthorizePageLocalesPreserveEscapingAndConsent','TestKoreanAuthorizeStillRequiresPasswordAndRegisteredRedirect','TestLocalizedTextPersistsRedactsAndClearsOnNewSummary','TestOwnedExecutionDescriptionsPreserveUnrecognizedAndUserText')
          $events = @(Get-Content dist/windows-package/backend-validation.jsonl | ForEach-Object { $_ | ConvertFrom-Json })
          foreach ($test in $required) {
            if (@($events | Where-Object { $_.Test -ceq $test -and $_.Action -ceq 'pass' }).Count -ne 1) { throw "Required Korean regression has not passed: $test" }
          }
          if (-not (Test-Path scripts/test/testdata/activity-center/KoreanPresentation.cs -PathType Leaf)) { throw 'The complete Korean presentation regression is missing.' }
          $result = & dotnet run --project scripts/test/testdata/activity-center/ActivityCenterTests.csproj -c Release -- --localization-only
          if ($LASTEXITCODE -ne 0 -or -not (($result -join "`n").Contains('Korean presentation acceptance:'))) { throw 'Compiled Korean resources and original-text preservation were not verified.' }
          $result | Set-Content dist/windows-package/korean-validation.txt -Encoding utf8NoBOM

      - name: Windows installer contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $staticOnly = '${{ inputs.installation_tests }}' -ne 'true'
          & .\scripts\test\test-install-windows.ps1 -StaticOnly:$staticOnly

      - name: Build Windows ZIP and offline Setup for each architecture
        run: |
          $ErrorActionPreference = 'Stop'
          $parameters = @{
            Architectures = @($env:BUILD_ARCHITECTURES -split ',')
            OutputDirectory = (Join-Path $PWD 'dist\windows-package')
          }
          if ('${{ steps.metadata.outputs.channel }}' -eq 'candidate-not-released') {
            $parameters.Candidate = $true
          }
          & .\packaging\windows\build-windows-release.ps1 @parameters

      - name: Verify package metadata and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $PWD 'dist\windows-package'
          $architectures = @($env:BUILD_ARCHITECTURES -split ',')
          $verification = foreach ($architecture in $architectures) {
            $result = & .\scripts\test\verify-windows-release-assets.ps1 `
              -ReleaseDirectory (Join-Path $outputRoot 'release') `
              -BuildReport (Join-Path $outputRoot 'build-report.json') `
              -ExpectedVersion '${{ steps.metadata.outputs.version }}' `
              -ExpectedCommit '${{ steps.metadata.outputs.commit }}' `
              -ExpectedChannel '${{ steps.metadata.outputs.channel }}' `
              -ExpectedAuthenticode unsigned -Architecture $architecture -Architectures $architectures
            ($result | Out-String) | ConvertFrom-Json
          }
          ConvertTo-Json -InputObject @($verification) -Depth 8 | Set-Content -Encoding utf8 (Join-Path $outputRoot 'verification.json')
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build modified tracked source.' }

      - name: Verify offline Setup installation and uninstall
        if: github.event_name == 'workflow_dispatch' && inputs.installation_tests == true
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-setup-e2e.ps1 `
            -SetupPath .\dist\windows-package\release\AgentDockSetup-amd64.exe `
            -LegacyCorePath .\dist\windows-package\payload-amd64\agentdock.exe `
            -LegacyTrayPath .\dist\windows-package\payload-amd64\agentdock-tray.exe `
            -AllowLegacyTaskMutation -EvidenceDirectory (Join-Path $PWD 'dist/windows-package/setup-evidence')

      - name: Verify historical 1.1.16102 upgrade repair and rollback
        id: upgrade
        if: github.event_name == 'workflow_dispatch' && inputs.installation_tests == true
        run: |
          $ErrorActionPreference = 'Stop'
          $baselineCommit = '4d719ce75ac748cb24e8ad4b7d92ff7c56e24225'
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'workbench-historical-source'
          $baselineOutput = Join-Path $env:RUNNER_TEMP 'workbench-historical-payload'
          git worktree add --detach $baselineRoot $baselineCommit
          if ($LASTEXITCODE -ne 0) { throw 'The preserved historical release source is unavailable.' }
          try {
            & (Join-Path $baselineRoot 'packaging/windows/build-windows-release.ps1') -Architectures amd64 -OutputDirectory $baselineOutput -CloudflaredBinary (Join-Path $PWD 'dist/windows-package/cloudflared.exe')
            $baselineReport = Get-Content (Join-Path $baselineOutput 'build-report.json') -Raw | ConvertFrom-Json
            if ($baselineReport.version -ne '1.1.16102' -or $baselineReport.commit -ne $baselineCommit -or $baselineReport.source_dirty) { throw 'Historical baseline provenance mismatch.' }
            & ./scripts/test/test-windows-upgrade-isolated.ps1 -Archive (Join-Path $PWD 'dist/windows-package/release/agentdock_windows_amd64.zip') `
              -BaselineArchive (Join-Path $baselineOutput 'release/agentdock_windows_amd64.zip') `
              -CloudflaredBinary (Join-Path $PWD 'dist/windows-package/cloudflared.exe') `
              -InstallerPath (Join-Path $PWD 'scripts/install/install.ps1') `
              -BaselineInstallerPath (Join-Path $baselineRoot 'scripts/install/install.ps1') -BaselineChannel setup `
              -ExpectedVersion '${{ steps.metadata.outputs.version }}' -ExerciseRollback `
              -ReportPath (Join-Path $PWD 'dist/windows-package/upgrade-validation.json')
            $receipt = Get-Content dist/windows-package/upgrade-validation.json -Raw | ConvertFrom-Json
            if (-not $receipt.passed -or $receipt.baseline -ne '1.1.16102' -or $receipt.target -ne '${{ steps.metadata.outputs.version }}') { throw 'Historical upgrade did not produce matching acceptance.' }
          } finally {
            git worktree remove $baselineRoot
            if ($LASTEXITCODE -ne 0) { throw 'Historical source cleanup failed; fixture was retained for inspection.' }
          }

      - name: Record verification scope
        run: |
          $installed = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.installation_tests }}' -eq 'true'
          $scope = @{
            schema_version = 1
            repository = 'eerraa/AgentDock-Workbench'
            native_architecture = 'amd64'
            baseline_version = $(if ('${{ steps.upgrade.outcome }}' -eq 'success') { '1.1.16102' } else { '' })
            baseline_source = '4d719ce75ac748cb24e8ad4b7d92ff7c56e24225'
            baseline_origin = 'rebuilt_unchanged_historical_release_source'
            production_touched = $false
            native_recovery = '${{ needs.native-acceptance.result }}'
            offscreen_layout = 'passed'
            korean_validation = $(if ('${{ steps.korean.outcome }}' -eq 'success') { 'passed' } else { 'not_run' })
            upgrade_recovery = $(if ('${{ steps.upgrade.outcome }}' -eq 'success') { 'passed' } else { 'not_run' })
            version = '${{ steps.metadata.outputs.version }}'
            automated_regression = 'passed'
            metadata_checksums = 'passed'
            installation_tests = $(if ($installed) { 'passed' } else { 'not_run_user_requested' })
            manual_desktop_tests = 'not_run'
            commit = '${{ steps.metadata.outputs.commit }}'
            resolved_commit = '${{ needs.resolve-source.outputs.commit }}'
            linux_tested_commit = '${{ needs.linux-contracts.outputs.commit }}'
            linux_backend = 'passed'
            linux_race = 'passed'
          }
          if ($scope.native_recovery -ne 'success') { throw 'Native recovery job has not passed.' }
          $scope.native_recovery = 'passed'
          $scope | ConvertTo-Json | Set-Content -Encoding utf8 .\dist\windows-package\verification-scope.json

      - name: Upload verified Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/windows-package/release/*
            dist/windows-package/build-report.json
            dist/windows-package/verification.json
            dist/windows-package/verification-scope.json
            dist/windows-package/upgrade-validation.json
            dist/windows-package/backend-validation.jsonl
            dist/windows-package/korean-validation.txt
            dist/windows-package/setup-evidence/*
            dist/windows-package/upgrade-evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failed candidate evidence without release approval
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unverified-windows-failure-${{ github.run_id }}
          path: |
            dist/windows-package/release/*
            dist/windows-package/build-report.json
            dist/windows-package/verification.json
            dist/windows-package/backend-validation.jsonl
            dist/windows-package/upgrade-validation.json
            dist/windows-package/setup-evidence/*
            dist/windows-package/upgrade-evidence/*
          if-no-files-found: warn
          retention-days: 30

      - name: Write build summary
        run: |
          @"
          ## Windows package

          - Version: `${{ steps.metadata.outputs.version }}`
          - Commit: `${{ steps.metadata.outputs.commit }}`
          - Channel: `${{ steps.metadata.outputs.channel }}`
          - Artifact: `${{ steps.metadata.outputs.artifact_name }}`
          - Publish requested: `${{ steps.metadata.outputs.publish }}`
          - Installation test input: `${{ inputs.installation_tests }}`
          - Manual desktop tests: not run
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

  publish:
    if: github.repository == 'eerraa/AgentDock-Workbench' && needs.build.outputs.publish == 'true'
    needs: [resolve-source, build, linux-contracts]
    name: Publish verified Windows x64 Release
    concurrency:
      group: windows-publish-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/windows-package

      - name: Verify downloaded package again
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('build-report.json','verification-scope.json')) {
            $source = Join-Path 'dist/windows-package' $name
            $target = Join-Path 'dist/windows-package/release' $name
            Copy-Item -LiteralPath $source -Destination $target
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText($target+'.sha256', "$hash  $name`n", [Text.UTF8Encoding]::new($false))
          }
          $report = Get-Content '.\dist\windows-package\build-report.json' -Raw | ConvertFrom-Json
          $architectures = @($report.platforms | ForEach-Object { ($_ -split '/')[1] })
          foreach ($architecture in $architectures) {
          & .\scripts\test\verify-windows-release-assets.ps1 `
            -ReleaseDirectory .\dist\windows-package\release `
            -BuildReport .\dist\windows-package\build-report.json `
            -ExpectedVersion '${{ needs.build.outputs.version }}' `
            -ExpectedCommit '${{ needs.build.outputs.commit }}' `
            -ExpectedChannel release `
            -ExpectedAuthenticode unsigned -Architecture $architecture -Architectures $architectures -IncludeMetadata -RequireAcceptance | Out-Null
          }
          $scope = Get-Content '.\dist\windows-package\verification-scope.json' -Raw | ConvertFrom-Json
          $commit = '${{ needs.resolve-source.outputs.commit }}'
          if ($scope.commit -ne $commit -or $scope.resolved_commit -ne $commit -or $scope.linux_tested_commit -ne $commit -or '${{ needs.build.outputs.commit }}' -ne $commit -or '${{ needs.linux-contracts.outputs.commit }}' -ne $commit) {
            throw 'Refusing publication: resolved, tested, built and packaged source identities differ.'
          }

      - name: Create or update GitHub Release after verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-StrictMode -Version Latest
          $repository = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $commit = $env:RELEASE_COMMIT
          if ($repository -cne 'eerraa/AgentDock-Workbench' -or $version -notmatch '^\d+\.\d+\.\d+$' -or
              $tag -cne ('v'+$version) -or $commit -notmatch '^[0-9a-f]{40}$' -or $env:RELEASE_PRERELEASE -cne 'false') {
              throw 'Publication is restricted to an explicitly verified formal fork release.'
          }
          $releaseRoot = (Resolve-Path .\dist\windows-package\release).Path
          $title = "AgentDock Workbench $version"
          $marker = "<!-- agentdock-workbench-source:$commit -->"
          function Assert-RemoteSource {
              $tagCommit = (& git rev-list -n 1 $tag).Trim().ToLowerInvariant()
              if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $commit) { throw 'Local release tag moved.' }
              $remoteTag = @(& git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
              if ($LASTEXITCODE -ne 0 -or $remoteTag.Count -eq 0) { throw 'Could not verify the current remote release tag.' }
              $peeled = @($remoteTag | Where-Object { $_ -match '\^\{\}$' })
              $remoteCommit = (($peeled + $remoteTag)[0] -split '\s+')[0].ToLowerInvariant()
              if ($remoteCommit -cne $commit) { throw 'Remote release tag moved after source resolution.' }
              $main = @(& git ls-remote origin refs/heads/main)
              if ($LASTEXITCODE -ne 0 -or $main.Count -ne 1 -or ($main[0] -split '\s+')[0] -cne $commit) {
                  throw 'The canonical remote main is not the verified release commit.'
              }
          }
          function Read-Release {
              # A failed lookup is unknown, never evidence that a release is absent.
              $raw = & gh api "repos/$repository/releases?per_page=100" --paginate --slurp
              if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed; no publication state was inferred.' }
              $pages = ($raw -join "`n") | ConvertFrom-Json
              $matches = @($pages | ForEach-Object { $_ } | Where-Object { $_.tag_name -ceq $tag })
              if ($matches.Count -gt 1) { throw 'Duplicate release identity.' }
              if ($matches.Count -eq 1) { return $matches[0] }
              return $null
          }
          $assets = @(Get-ChildItem -LiteralPath $releaseRoot -File | Sort-Object Name)
          if ($assets.Count -ne 10) { throw 'Expected the six x64 payload/checksum files and four metadata/checksum files.' }
          $digests = @{}
          foreach ($asset in $assets) { $digests[$asset.Name] = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Assert-RemoteAssets($Release, [bool]$Complete) {
              if ($null -eq $Release -or $Release.tag_name -cne $tag -or $Release.name -cne $title -or
                  -not ([string]$Release.body).Contains($marker)) { throw 'Release is not bound to this source and product.' }
              $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
              foreach ($remoteAsset in @($Release.assets)) {
                  $local = @($assets | Where-Object { $_.Name -ceq $remoteAsset.name })
                  if (-not $seen.Add([string]$remoteAsset.name) -or $local.Count -ne 1) { throw 'Unexpected or duplicate remote asset.' }
                  if ($remoteAsset.state -cne 'uploaded' -or [long]$remoteAsset.size -ne $local[0].Length -or
                      $remoteAsset.digest -cne ('sha256:'+$digests[$local[0].Name])) {
                      throw "Existing asset is different or incomplete; it will not be overwritten: $($remoteAsset.name)"
                  }
              }
              if ($Complete -and $seen.Count -ne $assets.Count) { throw 'Remote asset inventory is incomplete.' }
          }
          function Verify-DownloadedRelease([string]$Phase) {
              $directory = Join-Path $env:RUNNER_TEMP ('workbench-'+$Phase+'-'+[guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Path $directory | Out-Null
              & gh release download $tag --repo $repository --dir $directory
              if ($LASTEXITCODE -ne 0) { throw "Actual $Phase asset download failed; evidence remains at $directory" }
              $downloaded = @(Get-ChildItem -LiteralPath $directory -File)
              if (@(Compare-Object @($assets.Name | Sort-Object) @($downloaded.Name | Sort-Object) -CaseSensitive).Count -ne 0) { throw 'Downloaded asset inventory differs.' }
              foreach ($file in $downloaded) {
                  if ((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digests[$file.Name]) {
                      throw "Downloaded bytes differ: $($file.Name)"
                  }
              }
              & .\scripts\test\verify-windows-release-assets.ps1 -ReleaseDirectory $directory `
                  -BuildReport (Join-Path $directory 'build-report.json') -ExpectedVersion $version -ExpectedCommit $commit `
                  -ExpectedChannel release -ExpectedAuthenticode unsigned -Architecture amd64 -Architectures amd64 `
                  -IncludeMetadata -RequireAcceptance | Out-Null
              return [ordered]@{phase=$Phase;directory=$directory;actual_redownload=$true;files=$assets.Count;sha256=$digests}
          }
          Assert-RemoteSource
          & .\scripts\test\verify-windows-release-assets.ps1 -ReleaseDirectory $releaseRoot `
              -BuildReport (Join-Path $releaseRoot 'build-report.json') -ExpectedVersion $version -ExpectedCommit $commit `
              -ExpectedChannel release -ExpectedAuthenticode unsigned -Architecture amd64 -Architectures amd64 `
              -IncludeMetadata -RequireAcceptance | Out-Null
          $exactNotes = Join-Path $PWD "docs\releases\$tag.md"
          if (Test-Path -LiteralPath $exactNotes -PathType Leaf) { $notes = $exactNotes } else {
              $matches = @(Get-ChildItem .\docs\releases -File -Filter "$tag-*.md")
              if ($matches.Count -ne 1) { throw "Publication requires exactly one detailed release note: docs/releases/$tag.md or docs/releases/$tag-*.md." }
              $notes = $matches[0].FullName
          }
          $publicationNotes = Join-Path $env:RUNNER_TEMP ('workbench-notes-'+[guid]::NewGuid().ToString('N')+'.md')
          [IO.File]::WriteAllText($publicationNotes, ([IO.File]::ReadAllText($notes)+"`n`n"+$marker+"`n"), [Text.UTF8Encoding]::new($false))
          $release = Read-Release
          if ($null -ne $release) {
              if (-not $release.draft) { throw 'An already published release is immutable; no asset or metadata was changed.' }
              Assert-RemoteAssets $release $false
          } else {
              & gh release create $tag --repo $repository --verify-tag --draft --title $title --notes-file $publicationNotes
              if ($LASTEXITCODE -ne 0) { throw 'Draft creation result was not confirmed; inspect remote state before resuming.' }
              $release = Read-Release
              Assert-RemoteAssets $release $false
          }
          $missing = @($assets | Where-Object { $localName=$_.Name; @($release.assets | Where-Object { $_.name -ceq $localName }).Count -eq 0 })
          if ($missing.Count -gt 0) {
              & gh release upload $tag @($missing.FullName) --repo $repository
              if ($LASTEXITCODE -ne 0) { throw 'Asset upload did not complete; the existing draft and bytes were retained.' }
          }
          $release = Read-Release
          if (-not $release.draft) { throw 'Release state changed before draft verification.' }
          Assert-RemoteAssets $release $true
          $draftDownload = Verify-DownloadedRelease 'draft'
          Assert-RemoteSource
          & gh release edit $tag --repo $repository --title $title --notes-file $publicationNotes --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication result is unknown; inspect remote state before resuming.' }
          $final = Read-Release
          if ($null -eq $final -or $final.draft -or $final.prerelease) { throw 'Formal release state was not confirmed.' }
          Assert-RemoteAssets $final $true
          $publicDownload = Verify-DownloadedRelease 'published'
          $latestRaw = & gh api "repos/$repository/releases/latest"
          if ($LASTEXITCODE -ne 0 -or (($latestRaw -join "`n") | ConvertFrom-Json).id -ne $final.id) { throw 'Latest release identity was not confirmed.' }
          [ordered]@{repository=$repository;tag=$tag;version=$version;commit=$commit;draft=$false;prerelease=$false;url=$final.html_url;draft_verification=$draftDownload;published_verification=$publicDownload} |
              ConvertTo-Json -Depth 8 | Set-Content -LiteralPath .\dist\windows-package\publication-verification.json -Encoding utf8NoBOM
          "## Published Release`n`n$($final.html_url)" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Preserve actual publication verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-publication-${{ github.run_id }}
          path: dist/windows-package/publication-verification.json
          if-no-files-found: warn
          retention-days: 30
